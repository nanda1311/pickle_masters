{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}
<title>Update Profile | Profile</title>
{% endblock title %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">



<style>
    /* ───── FORM ONLY — SUPER CLEAN ───── */
    form {
    display: grid;
    gap: 3px;
    max-width: 100%;
    margin: 2rem auto 0;
    }

    form label {
    font-weight: 600;
    color: #374151;
    font-size: 0.95rem;
    }

    form input {
    padding: 0.85rem 1rem;
    border: 1.8px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
    transition: all .2s;
    }

    form input:focus {
    outline: none;
    border-color: #d88641;
    box-shadow: 0 0 0 4px rgba(99,102,241,.15);
    }

    form hr {
    border: none;
    border-top: 1.5px solid #e5e7eb;
    margin: 1.5rem 0;
    }

    form button[type="submit"] {
    margin-top: 15px;
    padding: 0.9rem 2rem;
    background: #d88641;
    color: white;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: .2s;
    }

    form button[type="submit"]:hover {
    background: #d59764ff;
    transform: translateY(-1px);
    }

    /* Messages */
    {% if messages %}
    .msg {
        padding: .75rem 1rem;
        border-radius: 8px;
        font-weight: 500;
        margin-bottom: .75rem;
    }
    .msg.success { background: #d1fae5; color: #059669; }
    .msg.error   { background: #fee2e2; color: #dc2626; }
    {% endif %}
</style>



<body>
<div style="margin-top: 120px;" class="container1">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>My Profile</h2>
    <a href="{% url 'profile' %}"><button>Dashboard</button></a>
    <a href="{% url 'orders_page' %}"><button>Orders</button></a>
    <a href="{% url 'address_profile' %}"><button>Addresses</button></a>
    <a href="{% url 'update_profile' %}"><button style="background:#d88641;color:#fff;">Update Profile</button></a>
    <a href="{% url 'logout' %}"><button>Log Out</button></a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h2>Update Profile</h2>

    {% if messages %}
      {% for message in messages %}
        <div style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; margin-bottom: 10px;">
            {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      
      <label for="username">Username</label>
      <input type="text" name="username" id="username" value="{{ user.username }}" required>

      <label for="email">Email</label>
      <input type="email" name="email" id="email" value="{{ user.email }}" required>

      <hr style="margin:20px 0;">

      <label for="current_password">Current Password</label>
      <input type="password" name="current_password" id="current_password" placeholder="Enter current password">

      <label for="new_password">New Password</label>
      <input type="password" name="new_password" id="new_password" placeholder="Enter new password">

      <label for="confirm_password">Confirm New Password</label>
      <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password">

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
</body>
{% endblock content %}
