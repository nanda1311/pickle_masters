{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}
<title>Address | Profile</title>
{% endblock title %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">

<body>
  <div style="margin-top: 120px;" class="container1">

    <!-- Sidebar -->
    <div class="sidebar">
      <h2>My Profile</h2>
      <a href="{% url 'profile' %}"><button style="background:#d88641;color:#fff;">Dashboard</button></a>
      <a href="{% url 'orders_page' %}"><button>Orders</button></a>
      <a href="{% url 'address_profile' %}"><button>Addresses</button></a>
      <a href="{% url 'update_profile' %}"><button>Update Profile</button></a>
      <a href="{% url 'logout' %}"><button>Log Out</button></a>
    </div>

  <div class="main-content">
      <h2>Dashboard</h2>
      <div class="cards">
        <div class="card cart">
          <div class="icon">&#128722;</div>
          <div class="label"><b>{{ cart_count }}</b> Products on Cart</div>
        </div>

        <div class="card orders">
            <div class="icon">&#128717;</div>
            <div class="label"><b>{{ user_orders_count }}</b> Orders</div>
        </div>
      </div>
    </div>
</div> 


{% endblock content %}
